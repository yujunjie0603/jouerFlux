services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  jouerflux:
    build: .
    container_name: jouerflux
    restart: unless-stopped
    depends_on: [redis]
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    environment:
      PYTHONPATH: /app
      FLASK_APP: "run.py"
      FLASK_ENV: "development"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      CELERY_BROKER_URL:  "${REDIS_URL:-redis://redis:6379}/0"
      CELERY_RESULT_BACKEND: "${REDIS_URL:-redis://redis:6379}/1"
      EXTERNAL_API_URL: "${EXTERNAL_API_URL}"
      EXTERNAL_API_TOKEN: "${EXTERNAL_API_TOKEN}"
    command: flask run --host=0.0.0.0 --port=5000 --reload
    ports:
      - "5000:5000"

  worker:
    build: .
    depends_on: [redis]
    working_dir: /app
    volumes:
      - .:/app
    env_file: .env
    environment:
      PYTHONPATH: /app
      REDIS_URL: "${REDIS_URL:-redis://redis:6379}"
      CELERY_BROKER_URL:  "${REDIS_URL:-redis://redis:6379}/0"
      CELERY_RESULT_BACKEND: "${REDIS_URL:-redis://redis:6379}/1"
      EXTERNAL_API_URL: "${EXTERNAL_API_URL}"
      EXTERNAL_API_TOKEN: "${EXTERNAL_API_TOKEN}"
    command: celery -A app.celery_worker:celery worker -l info -Q default

  flower:
    image: mher/flower:latest
    depends_on: [redis, worker]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"
    command: ["celery", "flower", "--broker=${REDIS_URL:-redis://redis:6379}/0", "--port=5555"]